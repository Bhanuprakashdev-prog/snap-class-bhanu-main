<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapClass | AI Attendance Platform</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1 class="brand-title">SnapClass</h1>
    </header>

    <div class="container text-center mt-4">
        <h2 style="font-size: 2.5rem; margin-bottom: 0.5rem;">Select your portal</h2>
        <p class="mb-2" style="color: var(--text-muted); font-size: 1.1rem;">Secure, AI-powered attendance tracking.</p>
        
        <div class="grid-2 mt-4" style="max-width: 800px; margin-left: auto; margin-right: auto;">
            <!-- Student Portal -->
            <div class="card">
                <div style="font-size: 3rem; margin-bottom: 1rem;">👨‍🎓</div>
                <h3 class="card-title">Student Portal</h3>
                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">FaceID Check-in, What-If Simulator & Habits</p>
                <a href="student.html" class="btn btn-primary" style="width: 100%;">Enter as Student</a>
            </div>

            <!-- Teacher Portal -->
            <div class="card">
                <div style="font-size: 3rem; margin-bottom: 1rem;">👨‍🏫</div>
                <h3 class="card-title">Teacher Portal</h3>
                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">QR Studio, Risk Radar & Class Management</p>
                <a href="teacher.html" class="btn btn-secondary" style="width: 100%;">Enter as Teacher</a>
            </div>
            
            <!-- Admin Portal -->
            <div class="card" style="grid-column: 1 / -1; max-width: 400px; margin: 0 auto; margin-top: 1rem;">
                <div style="font-size: 2.5rem; margin-bottom: 1rem;">🏛️</div>
                <h3 class="card-title">Admin & HOD</h3>
                <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Institutional Defaulters & KPIs</p>
                <a href="admin.html" class="btn" style="background-color: var(--indigo); color: white; width: 100%;">Enter as Admin</a>
            </div>
        </div>
    </div>
</body>
</html>
